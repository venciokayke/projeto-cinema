<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineControl - Cadastro Sala</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">CineControl</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
                    <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
                    <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Venda</a></li>
                    <li class="nav-item"><a class="nav-link" href="sessoes.html">Ver Sessões</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container shadow-sm p-4 bg-white rounded">
        <h2 class="mb-4">Cadastrar Nova Sala</h2>

        <form id="formSala">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nomeSala" class="form-label">Nome da Sala</label>
                    <input type="text" id="nomeSala" class="form-control" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="capacidade" class="form-label">Capacidade de Pessoas</label>
                    <input type="number" id="capacidade" class="form-control">
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="tipo" class="form-label">Tipo de Sala</label>
                        <select id="tipo" class="form-select" required>
                            <option value="">Selecione...</option>
                            <option value="2d">2D</option>
                            <option value="3d">3D</option>
                            <option value="imax">IMAX</option>
                        </select>
                    </div>
                </div>
            </div>


            <button type="submit" class="btn btn-primary w-100 mt-3">Salvar Sala</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
